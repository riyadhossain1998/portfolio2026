<!-- Project 04 — one node emitting, one node receiving. A hum
     crossing the gap, drawn as expanding arcs. -->
<svg class="project-thumb th-hum" viewBox="0 0 400 300" aria-hidden="true" focusable="false">
  <!-- The arcs start clear of the hum node's ring — both are the
       same dashed accent stroke, and crossing them muddies both. -->
  <g class="t-ring t-emit">
    <path d="M158 106a58 58 0 0 1 0 88"/>
    <path d="M172 78a92 92 0 0 1 0 144"/>
    <path d="M186 50a126 126 0 0 1 0 200"/>
  </g>
  <g class="t-edge">
    <path d="M104 150 60 150" stroke-width="1.5"/>
    <path d="M330 150 366 150" stroke-width="1.5"/>
  </g>
  <circle class="t-node" cx="60" cy="150" r="8"/>
  <circle class="t-node" cx="366" cy="150" r="8"/>
  <!-- Both ends are ordinary nodes; which one is lit is a state.
       The hum end is accented at rest, the dish end on hover.
       The ring travels with the accent, the same way it marks the
       live node in 01, 02 and 03. -->
  <circle class="t-ring h-ring" data-end="hum" cx="122" cy="150" r="31"/>
  <circle class="t-ring h-ring" data-end="dish" cx="312" cy="150" r="31"/>
  <circle class="t-node h-end" data-end="hum" cx="122" cy="150" r="19"/>
  <circle class="t-node h-end" data-end="dish" cx="312" cy="150" r="19"/>
  <text class="t-label" x="122" y="216">You hum</text>
  <text class="t-label" x="312" y="216">Salad recipe</text>
  <text class="t-num" x="22" y="278">04</text>
</svg>
