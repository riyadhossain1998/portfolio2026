<!-- Project 03 — a fulfilment pipeline: three stages left to
     right, items hanging off each one, current stage marked. -->
<svg class="project-thumb th-pipeline" viewBox="0 0 400 300" aria-hidden="true" focusable="false">
  <g class="t-edge">
    <path d="M76 150 188 150" stroke-width="3"/>
    <path d="M188 150 300 150" stroke-width="3"/>
    <path d="M300 150 358 150" stroke-width="1.5"/>
    <path d="M76 150 46 96" stroke-width="1.25"/>
    <path d="M76 150 46 204" stroke-width="1.25"/>
    <path d="M188 150 170 74" stroke-width="1.25"/>
    <path d="M188 150 206 226" stroke-width="1.25"/>
    <path d="M300 150 318 86" stroke-width="1.25"/>
    <path d="M300 150 326 212" stroke-width="1.25"/>
  </g>
  <circle class="t-node" cx="46" cy="96" r="7"/>
  <circle class="t-node" cx="46" cy="204" r="7"/>
  <circle class="t-node" cx="170" cy="74" r="7"/>
  <circle class="t-node" cx="206" cy="226" r="7"/>
  <circle class="t-node" cx="318" cy="86" r="7"/>
  <circle class="t-node" cx="326" cy="212" r="7"/>
  <circle class="t-node" cx="76" cy="150" r="14"/>
  <circle class="t-node" cx="358" cy="150" r="10"/>
  <!-- Pack holds the accent at rest; hover hands it to Complete.
       Both stages are drawn at all times so the change is a
       property swap, not an element appearing. -->
  <circle class="t-ring s-ring" data-stage="pack" cx="188" cy="150" r="29"/>
  <circle class="t-ring s-ring" data-stage="done" cx="300" cy="150" r="26"/>
  <circle class="t-node s-node" data-stage="pack" cx="188" cy="150" r="17"/>
  <circle class="t-node s-node" data-stage="done" cx="300" cy="150" r="14"/>
  <text class="t-label" x="76" y="254">Prepare</text>
  <text class="t-label" x="188" y="254">Pack</text>
  <text class="t-label" x="300" y="254">Complete</text>
  <text class="t-num" x="22" y="278">03</text>
</svg>
